[defaults]
inventory = inventory.ini

# Cache gathered facts between runs: skips the setup phase on re-runs
# (facts rarely change on a personal machine).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_cache
fact_caching_timeout = 86400

# Print per-task timing after each run so slow spots are visible.
callbacks_enabled = ansible.posix.profile_tasks
