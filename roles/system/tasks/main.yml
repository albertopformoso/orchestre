---
- name: Update system packages (pacman)
  community.general.pacman:
    update_cache: true
    upgrade: true
  become: true

- name: Reduce bootloader menu timeout to 0 seconds
  ansible.builtin.replace:
    path: /boot/loader/loader.conf
    regexp: '^timeout\s+\d+'
    replace: 'timeout 0'
  register: timeout_update
  failed_when: false

- name: Fallback to alternate EFI path if /boot/loader/loader.conf wasn't found
  ansible.builtin.replace:
    path: /efi/loader/loader.conf
    regexp: '^timeout\s+\d+'
    replace: 'timeout 0'
  when: timeout_update.failed or (timeout_update.msg is defined and "Could not find" in timeout_update.msg)

# All repo packages are installed in one transaction: pacman holds a global
# lock, so a single call is both correct and much faster than several.
- name: Install all pacman (repo) packages
  ansible.builtin.package:
    name:
      # Essential system and CLI tools
      - ufw
      - git
      - base-devel
      - fastfetch
      - btop
      - ripgrep
      - fd
      - tmux
      - brightnessctl
      - power-profiles-daemon # powerprofilesctl
      - yay
      - scx-scheds
      - ristretto
      - okular
      - bluetui
      - tree
      # System libraries (previously separate task)
      - gtk-layer-shell
      - webkit2gtk-4.1
      - dart-sass
      - qt6ct
      # Fonts (from the fonts role)
      - ttf-jetbrains-mono-nerd
      - ttf-meslo-nerd
      - ttf-nerd-fonts-symbols-mono
      # SDDM display manager (from the sddm role)
      - sddm
      - qt6-declarative
      - qt6-svg
      # Hyprland desktop (from the hyprland role)
      - hyprland
      - rofi-wayland    # Clean application launcher (also used by waybar menus)
      - swww            # High-performance animated wallpaper daemon
      - wl-clipboard    # System clipboard integration for Wayland
      - xorg-xwayland   # For legacy apps that don't support Wayland natively
      - hyprpaper
      - hyprlock
      - hypridle
      - hyprpolkitagent
      # Notifications (from the notifications role)
      - mako
      - libpulse           # paplay for notification sounds (also works with PipeWire-Pulse)
      - libnotify          # notify-send for battery alerts and terminal tests
      - sound-theme-freedesktop # System warning sound for low-battery alerts
      - python-gobject     # Notification workspace bridge (Gio D-Bus)
      - gdk-pixbuf2
      - papirus-icon-theme
      # Waybar companions (from the waybar role)
      - cpupower           # Per-profile CPU frequency ceilings
      - playerctl          # MPRIS media controls and Python introspection bindings
      - json-glib          # Native Waybar hover-scrolling media title
      - wlogout            # Fullscreen power menu
      - pavucontrol        # Floating volume mixer (opened by the volume module)
      - networkmanager     # Required by the Wi-Fi menu (nmcli) and the network module
      - bluez              # Bluetooth stack (bluez + bluetoothd) for the bluetooth module
      - bluez-utils        # bluetoothctl: saves/restores adapter power state across reboots
    state: present

- name: Create the `aur_builder` user
  become: true
  ansible.builtin.user:
    name: aur_builder
    create_home: true
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
    create: true
    mode: 0644
    validate: 'visudo -cf %s'

# All AUR builds run in one yay invocation: yay serializes on pacman's lock
# anyway, and one call means one dependency resolution pass.
- name: Install AUR packages (single yay run)
  kewlfft.aur.aur:
    use: yay
    name:
      - nwg-look
      - gnome-themes-extra
      - hyprshot
      - trayscale
    state: present
  become: true
  become_user: aur_builder

- name: Read installed Waybar version
  ansible.builtin.command: pacman -Q waybar-git
  register: installed_waybar
  changed_when: false
  failed_when: installed_waybar.rc not in [0, 1]

- name: Install Waybar with pending-window cleanup fix
  when: installed_waybar.stdout != 'waybar-git 0.15.0.r1004.g6d60c8e-2'
  block:
    - name: Install Waybar build dependencies
      ansible.builtin.package:
        name:
          - meson
          - ninja
          - scdoc
          - wayland-protocols
        state: present

    - name: Deploy local Waybar package recipe and patch
      ansible.builtin.copy:
        src: waybar/
        dest: /home/aur_builder/waybar-orchestre/
        owner: aur_builder
        group: wheel
        mode: '0644'
        directory_mode: '0755'

    - name: Build patched Waybar package
      ansible.builtin.command: makepkg --syncdeps --noconfirm --force
      args:
        chdir: /home/aur_builder/waybar-orchestre
      become: true
      become_user: aur_builder
      environment:
        PKGEXT: .pkg.tar.zst

    - name: Install patched Waybar package
      ansible.builtin.command: >-
        pacman -U --noconfirm --needed
        /home/aur_builder/waybar-orchestre/waybar-git-0.15.0.r1004.g6d60c8e-2-x86_64.pkg.tar.zst

- name: Ensure msi-ec module loads at boot (MSI laptops only)
  # msi-ec-dkms-git ships this exact file, but the module has no DMI autoload
  # and pacman only restores the file on a package reinstall - without it
  # nothing loads msi_ec at boot and /sys/devices/platform/msi-ec (fan
  # control) silently disappears after the next reboot. An earlier version
  # of this role *removed* this file as a "leftover", which broke fan mode
  # after the following reboot. Deploy it ourselves so the playbook
  # self-heals and the file always matches what the package ships.
  ansible.builtin.copy:
    dest: /etc/modules-load.d/msi-ec.conf
    content: "msi-ec\n"
    owner: root
    group: root
    mode: '0644'
  become: true
  when: is_msi_device

- name: Remove stale msi_ec/0.13 DKMS module from a previous manual install (MSI laptops only)
  # The old manual msi-ec install registered msi_ec/0.13 in DKMS; on every
  # kernel upgrade it won the install race against msi-ec/r716 ("already
  # installed at version 0.13, override by specifying --force"), so the git
  # module never actually got installed. Unregister it, then delete the tree.
  ansible.builtin.command: dkms remove msi_ec/0.13 --all
  become: true
  when: is_msi_device
  failed_when: false
  changed_when: false

- name: Remove leftover msi_ec DKMS source tree from a previous manual install (MSI laptops only)
  ansible.builtin.file:
    path: /usr/src/msi_ec-0.13
    state: absent
  become: true
  when: is_msi_device

- name: Install msi-ec kernel module (MSI laptops only)
  kewlfft.aur.aur:
    use: yay
    name: msi-ec-dkms-git
    state: present
  become: true
  become_user: aur_builder
  when: is_msi_device

- name: Build msi-ec for every installed kernel (MSI laptops only)
  # kewlfft.aur with state=present is a no-op for an already-installed
  # package, so freshly installed kernel variants (e.g. the LTS kernel after
  # a cleanup) would keep no msi-ec module until their next package upgrade.
  # dkms autoinstall builds/installs msi-ec for every kernel that has a
  # module tree; a no-op when everything is already in place.
  ansible.builtin.command: dkms autoinstall
  become: true
  when: is_msi_device
  changed_when: false
  failed_when: false

- name: Ensure local icons directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/icons"
    state: directory
    mode: '0755'

- name: Ensure local icons directory exists (by uid path)
  ansible.builtin.file:
    path: "/home/{{ ansible_facts['user_id'] }}/.local/share/icons"
    state: directory
    mode: '0755'

- name: Enable UFW service on boot
  ansible.builtin.systemd:
    name: ufw
    enabled: true
    state: started

- name: Configure UFW default policies
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Enable Network Time Synchronization (NTP)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Install and configure cursors
  ansible.builtin.import_tasks: cursors.yml
  tags: cursors

- name: Apply dark theme for GTK apps
  ansible.builtin.copy:
    src: settings.ini
    dest: "/home/{{ current_user }}/.config/gtk-3.0/settings.ini"
    owner: "{{ current_user }}"
    mode: '0644'

- name: Set dark theme via gsettings
  ansible.builtin.command:
    cmd: "gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'"
  become: false
  become_user: "{{ current_user }}"


# Scripts
- name: Ensure local bin directory exists
  tags: sddm
  ansible.builtin.file:
    path: "/home/{{ current_user }}/.local/bin"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Wallpaper and avatar scripts
  tags: sddm
  ansible.builtin.copy:
    src: scripts/{{ item }}.sh
    dest: "/home/{{ current_user }}/.local/bin/{{ item }}"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'
  loop:
    - setbg
    - setavatar

- name: Background script (keyboard backlight helper, MSI laptops only)
  ansible.builtin.copy:
    src: scripts/kbdlight.sh
    dest: "/home/{{ current_user }}/.local/bin/kbdlight"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'
  when: is_msi_device

- name: Allow users to control MSI keyboard backlight (MSI laptops only)
  become: true
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-msi-kbd-backlight.rules
    content: 'ACTION=="add", SUBSYSTEM=="leds", KERNEL=="msiacpi::kbd_backlight", RUN+="/bin/sh -c \"sleep 1 && /usr/bin/chmod 666 /sys/class/leds/%k/brightness\""'
    owner: root
    group: root
    mode: '0644'
  notify: Reload udev rules
  when: is_msi_device

- name: Allow user to change keyboard backlight without sudo password (MSI laptops only)
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/kbdlight
    content: "{{ current_user }} ALL=(ALL) NOPASSWD: /usr/bin/tee /sys/class/leds/msiacpi\\:\\:kbd_backlight/brightness"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  when: is_msi_device
