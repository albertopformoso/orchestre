---
- name: Ensure Orchestre theme directory exists
  ansible.builtin.file:
    path: /usr/share/sddm/themes/orchestre
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install Orchestre theme files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/share/sddm/themes/orchestre/
    owner: root
    group: root
    mode: preserve
    directory_mode: '0755'
  loop:
    - Main.qml
    - theme.conf
    - metadata.desktop
    - components
    - assets
  become: true

- name: Ensure image helper and persistent storage directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /usr/local/libexec
    - /var/lib/orchestre
    - /var/lib/orchestre/sddm
  become: true

- name: Install the fixed-destination SDDM image helpers
  ansible.builtin.copy:
    src: "scripts/orchestre-sddm-{{ item }}"
    dest: "/usr/local/libexec/orchestre-sddm-{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - background
    - avatar
  become: true

- name: Associate the custom SDDM avatar with the desktop account
  community.general.ini_file:
    path: /usr/share/sddm/themes/orchestre/theme.conf.user
    section: General
    option: syncedAvatarUser
    value: "{{ current_user }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Check for a saved SDDM wallpaper
  ansible.builtin.stat:
    path: /var/lib/orchestre/sddm/background.png
  register: sddm_saved_background

- name: Check the current desktop wallpaper
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/hypr/current_wallpaper"
    follow: true
  register: sddm_current_background

- name: Seed SDDM with the current desktop wallpaper
  when:
    - not sddm_saved_background.stat.exists
    - sddm_current_background.stat.isreg | default(false)
  block:
    - name: Create a temporary PNG as the desktop user
      ansible.builtin.tempfile:
        suffix: .png
      become: true
      become_user: "{{ current_user }}"
      register: sddm_initial_png

    - name: Convert the initial wallpaper as the desktop user
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import gi, sys
            gi.require_version('GdkPixbuf', '2.0')
            from gi.repository import GdkPixbuf
            image = GdkPixbuf.Pixbuf.new_from_file(sys.argv[1])
            image.savev(sys.argv[2], 'png', [], [])
          - "{{ user_home }}/.config/hypr/current_wallpaper"
          - "{{ sddm_initial_png.path }}"
      become: true
      become_user: "{{ current_user }}"
      changed_when: true

    - name: Publish the initial SDDM wallpaper
      ansible.builtin.shell:
        cmd: "/usr/local/libexec/orchestre-sddm-background < {{ sddm_initial_png.path | quote }}"
      become: true
      changed_when: true
  always:
    - name: Remove the temporary initial wallpaper
      ansible.builtin.file:
        path: "{{ sddm_initial_png.path }}"
        state: absent
      when: sddm_initial_png.path is defined

- name: Ensure /etc/sddm.conf.d exists
  ansible.builtin.file:
    path: /etc/sddm.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Set Orchestre as the active SDDM theme
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/theme.conf
    content: |
      [Theme]
      Current=orchestre
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Allow current_user to publish SDDM images without a password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/orchestre-sddm-{{ item }}"
    content: |
      {{ current_user }} ALL=(root) NOPASSWD: /usr/local/libexec/orchestre-sddm-{{ item }} ""
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  loop:
    - background
    - avatar
  become: true

- name: Remove old user-editable image script sudo permissions
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item }}-sddm"
    state: absent
  loop:
    - setbg
    - setavatar
  become: true

- name: Enable and start SDDM
  ansible.builtin.systemd:
    name: sddm
    state: started
    enabled: true
  become: true
