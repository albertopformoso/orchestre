[General]
# Path to the wallpaper.
background=assets/background.jpg
# Populated by setbg; the bundled image remains the fallback.
syncedBackground=file:///var/lib/orchestre/sddm/background.png
# Populated by setavatar; Ansible sets the owning account in theme.conf.user.
syncedAvatar=file:///var/lib/orchestre/sddm/avatar.png
syncedAvatarUser=

# Charcoal / grayscale desktop palette
primaryColor=#f5f6f8
accentColor=#9398a1
autoColor=false
use24HourClock=true
backgroundColor=#202124
textColor=#f5f6f8

# Font settings
fontFamily=Google Sans Flex
fontSize=12
