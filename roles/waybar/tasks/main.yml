---
- name: Enable bluetooth service on boot
  ansible.builtin.systemd:
    name: bluetooth
    enabled: true
    state: started

- name: Keep bluez from force-powering adapters at boot (AutoEnable=false)
  # bluez >= 5.65 defaults AutoEnable=true: bluetoothd powers every adapter on
  # at service start and on resume, discarding the user's last choice. With
  # false the adapter boots powered off; the units below restore the state
  # saved at the previous clean shutdown.
  ansible.builtin.lineinfile:
    path: /etc/bluetooth/main.conf
    regexp: '^\s*#?\s*AutoEnable\s*='
    line: 'AutoEnable=false'
    insertafter: '^\[Policy\]'
  notify: Restart bluetooth service

- name: Deploy Bluetooth power-state helper script
  ansible.builtin.copy:
    dest: /usr/local/bin/bluetooth-power-state
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      # Persist the Bluetooth adapter's Powered state across reboots, suspends,
      # and shutdowns: bluez doesn't store it, and AutoEnable=false boots the
      # adapter powered off. Modes:
      #   save    - query the adapter and write on/off to the state file
      #   restore - explicitly apply the saved state (both on AND off)
      #   monitor - long-running: poll for user power changes
      #   pause   - suspend entry: freeze the monitor, then save (see below)
      #   resume  - wake: restore the saved state, restart the monitor
      #
      # pause/resume exist because bluetoothd powers adapters down as part of
      # the suspend sequence; a live monitor would see that as a user power-off
      # and poison the state file. Pausing freezes the saved state until wake.
      STATE_FILE=/var/lib/bluetooth-power-state

      log() { echo "bluetooth-power-state: $*" >&2; }

      # Query current adapter power. Echoes "on"/"off", or fails (non-zero) if
      # bluetoothd/D-Bus can't be reached - the caller then keeps the last
      # saved value instead of guessing.
      query_power() {
          powered=$(bluetoothctl show 2>/dev/null | sed -n 's/^[[:space:]]*Powered: //p' | head -n 1)
          [ -n "$powered" ] || return 1
          [ "$powered" = "yes" ] && echo on || echo off
      }

      save() {
          state=$(query_power) || { log "query failed; keeping last saved state"; return 0; }
          echo "$state" > "$STATE_FILE"
      }

      restore() {
          state=$(cat "$STATE_FILE" 2>/dev/null)
          [ "$state" = "on" ] || [ "$state" = "off" ] || exit 0
          # Controller registration can lag bluetoothd startup (firmware load),
          # and bluetoothd may re-power adapters on resume; apply the saved
          # state until it sticks. ~20s covers slow firmware loads.
          i=0
          while [ "$i" -lt 20 ]; do
              if bluetoothctl power "$state" >/dev/null 2>&1; then
                  exit 0
              fi
              i=$((i + 1))
              sleep 1
          done
          log "controller never appeared; keeping saved state for the next restore"
          return 1
      }

      monitor() {
          # bluetoothctl monitor is not a valid command on current BlueZ; it
          # exits immediately and makes the service restart forever. Poll only
          # after the boot restore has finished. Keep the last saved value if
          # the controller temporarily disappears instead of recording "off".
          while :; do
              state=$(query_power) && {
                  saved=$(cat "$STATE_FILE" 2>/dev/null)
                  [ "$state" = "$saved" ] || echo "$state" > "$STATE_FILE"
              }
              sleep 2
          done
      }

      pause() {
          # Called at suspend start, before logind's PrepareForSleep reaches
          # bluetoothd. Stop the monitor first so bluetoothd's suspend power-
          # down is NOT recorded as a user choice, then record the true
          # pre-suspend state. An explicit systemctl stop never triggers the
          # monitor's Restart=, so it stays frozen for the whole sleep.
          systemctl stop bluetooth-state-monitor.service 2>/dev/null
          save
      }

      resume() {
          # Apply the pre-suspend state first (bluetoothd does not re-power
          # adapters on resume when AutoEnable=false), then resume live
          # tracking for the next user toggle.
          restore || return 1
          systemctl start bluetooth-state-monitor.service
      }

      case "$1" in
          save) save ;;
          restore) restore ;;
          monitor) monitor ;;
          pause) pause ;;
          resume) resume ;;
          *) echo "usage: $0 {save|restore|monitor|pause|resume}" >&2; exit 2 ;;
      esac
  notify: Restart Bluetooth state services

- name: Deploy Bluetooth power-state save unit (records state at shutdown)
  ansible.builtin.copy:
    dest: /etc/systemd/system/bluetooth-state-save.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Save Bluetooth adapter power state on shutdown
      # After= makes this unit's stop run before bluetooth.service's stop, so
      # bluetoothd is still up when queried; PartOf= re-saves on BT restarts.
      # dbus.service ordering guarantees the final bluetoothctl query still has
      # a system bus to talk to during shutdown.
      PartOf=bluetooth.service
      After=bluetooth.service dbus.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/true
      ExecStop=/usr/local/bin/bluetooth-power-state save

      [Install]
      WantedBy=multi-user.target

- name: Deploy Bluetooth power-state restore unit (re-applies state at boot)
  ansible.builtin.copy:
    dest: /etc/systemd/system/bluetooth-state-restore.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Restore Bluetooth adapter power state saved at shutdown
      After=bluetooth.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/bluetooth-power-state restore

      [Install]
      WantedBy=multi-user.target

- name: Deploy Bluetooth power-state sleep unit (pause monitor + save on suspend, restore on wake)
  # WantedBy=sleep.target: when the machine sleeps, sleep.target starts and
  # pulls this unit in, running ExecStart (pause) beforehand. PartOf makes
  # this unit stop when sleep.target stops on wake, running ExecStop (resume)
  # re-applies the last chosen state. pause stops the monitor FIRST so
  # bluetoothd's suspend-time adapter power-down is never recorded as a user
  # choice - without that, "on" gets poisoned to "off" during every suspend.
  ansible.builtin.copy:
    dest: /etc/systemd/system/bluetooth-state-sleep.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Save Bluetooth power state before sleep, restore it on wake
      PartOf=sleep.target
      Before=sleep.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/bluetooth-power-state pause
      ExecStop=/usr/local/bin/bluetooth-power-state resume

      [Install]
      WantedBy=sleep.target

- name: Deploy Bluetooth power-state monitor unit (live save on every toggle)
  # Polls the adapter's Powered property every two seconds, so the saved state
  # follows user toggles even when the shutdown save never runs.
  # The sleep unit stops this unit before suspend (bluetoothd powers adapters
  # down as part of the suspend sequence, and that must NOT be recorded as a
  # user choice) and starts it again after restoring the saved state on wake.
  # Explicit systemctl stops (the pause path) suppress Restart=always.
  ansible.builtin.copy:
    dest: /etc/systemd/system/bluetooth-state-monitor.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Track Bluetooth adapter power state changes live
      PartOf=bluetooth.service
      Requires=bluetooth-state-restore.service
      After=bluetooth.service dbus.service bluetooth-state-restore.service

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/bluetooth-power-state monitor
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Restart Bluetooth state services

- name: Load the Bluetooth power-state units into systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable Bluetooth power-state sleep unit without leaving it active while awake
  ansible.builtin.systemd:
    name: bluetooth-state-sleep.service
    enabled: true
    state: stopped

- name: Enable and start Bluetooth power-state save, restore, and monitor units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - bluetooth-state-save.service
    - bluetooth-state-restore.service
    - bluetooth-state-monitor.service

- name: Enable NetworkManager service on boot
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started

- name: Ensure waybar config directory exists
  ansible.builtin.file:
    path: "/home/{{ current_user }}/.config/waybar"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy waybar bar configuration
  ansible.builtin.copy:
    src: config
    dest: "/home/{{ current_user }}/.config/waybar/config"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Initialize notification attention stylesheet
  ansible.builtin.copy:
    content: "/* Managed at runtime by notification-workspaces. */\n"
    dest: "/home/{{ current_user }}/.config/waybar/notification-attention.css"
    force: false
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Deploy waybar stylesheet
  ansible.builtin.copy:
    src: style.css
    dest: "/home/{{ current_user }}/.config/waybar/style.css"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Ensure user local bin directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy waybar menu scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ user_home }}/.local/bin/{{ item }}"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'
  loop:
    - waybar-wifi-menu
    - waybar-power-menu
    - waybar-temp

- name: Deploy power profile switcher script (powerprofilesctl + MSI EC sync)
  ansible.builtin.copy:
    src: scripts/waybar-power-profile
    dest: "{{ user_home }}/.local/bin/waybar-power-profile"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy fan mode switcher script (MSI EC fan_mode/cooler_boost control)
  ansible.builtin.copy:
    src: scripts/waybar-fan-mode
    dest: "{{ user_home }}/.local/bin/waybar-fan-mode"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Allow user to sync MSI EC power/fan modes without sudo password (MSI laptops only)
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/waybar-msi-ec
    content: |
      {{ current_user }} ALL=(ALL) NOPASSWD: /usr/bin/tee /sys/devices/platform/msi-ec/shift_mode
      {{ current_user }} ALL=(ALL) NOPASSWD: /usr/bin/tee /sys/devices/platform/msi-ec/fan_mode
      {{ current_user }} ALL=(ALL) NOPASSWD: /usr/bin/tee /sys/devices/platform/msi-ec/cooler_boost
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  when: is_msi_device
