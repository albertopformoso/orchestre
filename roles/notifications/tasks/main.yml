---
- name: Determine the non-root username running the script
  ansible.builtin.set_fact:
    current_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"

- name: Extract user home directory details
  ansible.builtin.getent:
    database: passwd
    key: "{{ current_user }}"

- name: Set target home path variable
  ansible.builtin.set_fact:
    user_home: "{{ ansible_facts['user_dir'] }}"

- name: Install Hyprland and standard desktop dependencies
  ansible.builtin.package:
    name:
      - mako
      - gdk-pixbuf2
      - papirus-icon-theme
    state: present

- name: Ensure mako config directory exists
  ansible.builtin.file:
    path: "/home/{{ current_user }}/.config/mako"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Copy config files
  ansible.builtin.copy:
    src: .
    dest: "/home/{{ current_user }}/.config/mako/"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'
