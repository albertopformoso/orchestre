---
- name: Ensure notification sound directory exists
  ansible.builtin.file:
    path: "/home/{{ current_user }}/.local/share/sounds/orchestre"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy notification sounds
  ansible.builtin.copy:
    src: "sounds/{{ item }}.wav"
    dest: "/home/{{ current_user }}/.local/share/sounds/orchestre/{{ item }}.wav"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'
  loop:
    - normal
    - warning
    - error

- name: Remove obsolete custom battery sound
  ansible.builtin.file:
    path: "/home/{{ current_user }}/.local/share/sounds/orchestre/battery-low.wav"
    state: absent

- name: Ensure mako config directory exists
  ansible.builtin.file:
    path: "/home/{{ current_user }}/.config/mako"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy Mako configuration
  ansible.builtin.copy:
    src: config
    dest: "/home/{{ current_user }}/.config/mako/config"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Ensure notification helper directories exist
  ansible.builtin.file:
    path: "/home/{{ current_user }}/{{ item }}"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'
  loop:
    - .local/bin
    - .config/systemd/user

- name: Deploy notification workspace helper
  ansible.builtin.copy:
    src: notification-workspaces
    dest: "/home/{{ current_user }}/.local/bin/notification-workspaces"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy shared battery notification helper
  ansible.builtin.copy:
    src: battery-notifications
    dest: "/home/{{ current_user }}/.local/bin/battery-notifications"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy shared battery notification service
  ansible.builtin.copy:
    src: battery-notifications.service
    dest: "/home/{{ current_user }}/.config/systemd/user/battery-notifications.service"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Deploy notification workspace service
  ansible.builtin.copy:
    src: notification-workspaces.service
    dest: "/home/{{ current_user }}/.config/systemd/user/notification-workspaces.service"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'
