---
- name: Ensure target configuration directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/hypr"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Copy Hyprland configuration file to target destination physically
  ansible.builtin.copy:
    src: .
    dest: "/home/{{ current_user }}/.config/hypr/"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Deploy Hyprland cursor configuration
  tags: cursors
  block:
    - name: Ensure Hyprland modules directory exists
      ansible.builtin.file:
        path: "/home/{{ current_user }}/.config/hypr/modules"
        state: directory
        owner: "{{ current_user }}"
        group: "{{ current_user }}"
        mode: '0755'

    - name: Copy Hyprland settings and cursor startup command
      ansible.builtin.copy:
        src: "modules/{{ item }}"
        dest: "/home/{{ current_user }}/.config/hypr/modules/{{ item }}"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"
        mode: '0644'
        backup: true
      loop:
        - settings.lua
        - autostart.lua

- name: Deploy hypridle.conf from template (adds MSI-only keyboard listener)
  ansible.builtin.template:
    src: hypridle.conf.j2
    dest: "/home/{{ current_user }}/.config/hypr/hypridle.conf"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Ensure user local bin directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy user scripts (power, lid, and browser URL helpers)
  ansible.builtin.copy:
    src: scripts/
    dest: "{{ user_home }}/.local/bin/"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Ensure user applications directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/applications"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy external browser link handler
  ansible.builtin.template:
    src: orchestre-browser-url.desktop.j2
    dest: "{{ user_home }}/.local/share/applications/orchestre-browser-url.desktop"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Route external web links through the browser focus helper
  community.general.ini_file:
    path: "{{ user_home }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: orchestre-browser-url.desktop
    no_extra_spaces: true
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'
  loop:
    - x-scheme-handler/http
    - x-scheme-handler/https

- name: Remove stale pre-rename helper script (ppd-idle -> ppd-idle.sh)
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin/ppd-idle"
    state: absent

- name: Find all hyprlock scripts
  ansible.builtin.find:
    paths: "/home/{{ current_user }}/.config/hypr/hyprlock/scripts"
    file_type: file
  register: hyprlock_scripts

- name: Make hyprlock scripts executable
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: '0755'
  loop: "{{ hyprlock_scripts.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy logind drop-in so Hyprland owns lid handling
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-hyprland-lid.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Lid actions are handled by Hyprland switch binds (keybindings.lua) plus
      # ~/.local/bin/lid-suspend.sh: lock on close, suspend after 1.5h still closed.
      # Caveat: with these set to ignore, the lid does nothing when Hyprland is
      # not running (e.g. logged into a TTY).
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
  become: true
  notify: Restart systemd-logind
