---
- name: Determine whether this host is an MSI machine
  ansible.builtin.set_fact:
    is_msi_device: "{{ 'micro-star' in (ansible_facts['system_vendor'] | default('') | lower) }}"

- name: Determine the non-root username running the script
  ansible.builtin.set_fact:
    current_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"

- name: Extract user home directory details
  ansible.builtin.getent:
    database: passwd
    key: "{{ current_user }}"

- name: Set target home path variable
  ansible.builtin.set_fact:
    user_home: "{{ ansible_facts['user_dir'] }}"

- name: Install Hyprland and standard desktop dependencies
  ansible.builtin.package:
    name:
      - hyprland
      - rofi-wayland    # Clean application launcher option
      - swww            # High-performance animated wallpaper daemon
      - wl-clipboard    # System clipboard integration for Wayland
      - xorg-xwayland   # For legacy apps that don't support Wayland natively
      - hyprpaper
      - hyprlock
      - hypridle
      - hyprpolkitagent
    state: present

- name: Install Hypr AUR packages
  kewlfft.aur.aur:
    use: yay
    name:
      - hyprshot
    state: present
  become: true
  become_user: aur_builder

- name: Ensure target configuration directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/hypr"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Copy Hyprland configuration file to target destination physically
  ansible.builtin.copy:
    src: .
    dest: "/home/{{ current_user }}/.config/hypr/"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Deploy hypridle.conf from template (adds MSI-only keyboard listener)
  ansible.builtin.template:
    src: hypridle.conf.j2
    dest: "/home/{{ current_user }}/.config/hypr/hypridle.conf"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0644'

- name: Ensure user local bin directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Deploy user scripts (hypridle power-profile helper)
  ansible.builtin.copy:
    src: scripts/
    dest: "{{ user_home }}/.local/bin/"
    owner: "{{ current_user }}"
    group: "{{ current_user }}"
    mode: '0755'

- name: Remove stale pre-rename helper script (ppd-idle -> ppd-idle.sh)
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin/ppd-idle"
    state: absent

- name: Find all hyprlock scripts
  ansible.builtin.find:
    paths: "/home/{{ current_user }}/.config/hypr/hyprlock/scripts"
    file_type: file
  register: hyprlock_scripts

- name: Make hyprlock scripts executable
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: '0755'
  loop: "{{ hyprlock_scripts.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy logind drop-in so Hyprland owns lid handling
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-hyprland-lid.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Lid actions are handled by Hyprland switch binds (keybindings.lua) plus
      # ~/.local/bin/lid-suspend.sh: lock on close, suspend after 1.5h still closed.
      # Caveat: with these set to ignore, the lid does nothing when Hyprland is
      # not running (e.g. logged into a TTY).
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
  become: true
  notify: Restart systemd-logind
